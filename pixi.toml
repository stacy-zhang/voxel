[workspace]
name = "highd-webviz"
version = "0.1.0"
description = "Web-based 3D reciprocal-space map (RSM) visualization built with Trame and VTK."
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
start = "python -m voxel"
tomo = "python -m voxel.features.tomo"
test-imports = "python tests/test_import_isolation.py"

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pandas = "*"
h5py = "*"
tifffile = "*"
pyyaml = "*"
dask = "*"
matplotlib-base = "*"
scikit-image = "*"
lmfit = "*"
vtk = "*"
xrayutilities = "*"
trame = "*"
trame-vtk = "*"
trame-client = "*"
trame-server = "*"
tiled = ">=0.2.14,<0.3"
pipreqs = ">=0.5.0,<0.6"
trame-vuetify = ">=3.2.5,<4"
tomopy = ">=1.14.4,<2"
dxchange = ">=0.1.8,<0.2"
matplotlib = ">=3.11.0,<4"

[pypi-dependencies]
vtkplotlib = ">=2.1.1, <3"
